<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Search Dropdown - Exact Replica</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: arial, sans-serif;
            background: #f8f9fa;
            padding: 100px 20px;
            display: flex;
            justify-content: center;
        }

        /* EXACT GOOGLE SEARCH BAR */
        .search-container {
            max-width: 584px;
            width: 100%;
        }

        .search-wrapper {
            position: relative;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: white;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            padding: 0;
            height: 46px;
            box-shadow: 0 1px 6px rgba(32,33,36,.28);
            transition: all 0.2s ease;
        }

        .search-bar:hover {
            box-shadow: 0 1px 6px rgba(32,33,36,.28), 0 2px 6px 2px rgba(32,33,36,.15);
        }

        .search-bar.focused {
            box-shadow: 0 1px 6px rgba(32,33,36,.28);
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
        }

        .search-icon {
            padding: 0 13px 0 16px;
            display: flex;
            align-items: center;
        }

        .search-icon svg {
            width: 20px;
            height: 20px;
            fill: #9aa0a6;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-family: arial, sans-serif;
            font-size: 16px;
            color: #202124;
            background: transparent;
            padding: 0;
            height: 34px;
        }

        .search-input::placeholder {
            color: #9aa0a6;
        }

        .search-icons-right {
            display: flex;
            align-items: center;
            gap: 0px;
            padding-right: 13px;
        }

        .clear-icon {
            width: 24px;
            height: 24px;
            padding: 4px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            color: #70757a;
        }

        .clear-icon.visible {
            display: flex;
        }

        .clear-icon:hover {
            color: #202124;
        }

        /* EXACT GOOGLE DROPDOWN */
        .search-dropdown {
            position: absolute;
            top: 45px;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #dfe1e5;
            border-top: 1px solid #e8eaed;
            border-radius: 0 0 24px 24px;
            box-shadow: 0 4px 6px rgba(32,33,36,.28);
            display: none;
            z-index: 1000;
        }

        .search-dropdown.visible {
            display: block;
        }

        /* Google Suggestion Item - EXACT STYLE */
        .suggestion-item {
            display: flex;
            align-items: center;
            padding: 0 16px;
            height: 40px;
            cursor: pointer;
            font-family: arial, sans-serif;
            font-size: 16px;
            color: #202124;
            text-decoration: none;
            transition: background 0.05s ease;
        }

        .suggestion-item:hover,
        .suggestion-item.selected {
            background: #f1f3f4;
        }

        .suggestion-item:first-child {
            margin-top: 4px;
        }

        .suggestion-item:last-child {
            margin-bottom: 8px;
        }

        /* Google Suggestion Icon - EXACT */
        .suggestion-icon {
            width: 20px;
            height: 20px;
            margin-right: 16px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .suggestion-icon svg {
            width: 16px;
            height: 16px;
            fill: #70757a;
        }

        /* Recent search icon (clock) */
        .suggestion-item.recent .suggestion-icon svg {
            fill: #70757a;
        }

        /* Suggestion text */
        .suggestion-text {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Google trending icon */
        .trending-icon {
            margin-left: auto;
            padding-left: 16px;
        }

        .trending-icon svg {
            width: 16px;
            height: 16px;
            fill: #70757a;
        }

        /* Separator line like Google */
        .dropdown-separator {
            height: 1px;
            background: #e8eaed;
            margin: 8px 0;
        }

        /* Demo title */
        .demo-title {
            text-align: center;
            font-family: 'Google Sans', sans-serif;
            font-size: 2rem;
            color: #202124;
            margin-bottom: 40px;
        }
    </style>
</head>
<body>
    <div class="search-container">
        <h1 class="demo-title">Google-Style Search Dropdown</h1>
        
        <div class="search-wrapper">
            <div class="search-bar" id="searchBar">
                <div class="search-icon">
                    <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
                    </svg>
                </div>
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput"
                    placeholder="Search sections..."
                    autocomplete="off"
                >
                <div class="search-icons-right">
                    <div class="clear-icon" id="clearIcon">
                        <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- EXACT GOOGLE DROPDOWN -->
            <div class="search-dropdown" id="searchDropdown">
                <!-- Will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // Portfolio sections - FIXED: Each section now has a unique ID
        const sections = [
            { id: 'home', name: 'Home' },
            { id: 'journey', name: 'Journey' },
            { id: 'education', name: 'Education' },  // FIXED: Changed from 'journey' to 'education'
            { id: 'experience', name: 'Work Experience' },
            { id: 'projects', name: 'Projects' },
            { id: 'achievements', name: 'Achievements' },
            { id: 'skills', name: 'Skills' },
            { id: 'contact', name: 'Contact Me' }
        ];

        // State
        let recentSearches = JSON.parse(localStorage.getItem('portfolioSearchHistory') || '[]');
        let selectedIndex = -1;
        let allSuggestions = [];

        // DOM Elements
        const searchInput = document.getElementById('searchInput');
        const searchBar = document.getElementById('searchBar');
        const searchDropdown = document.getElementById('searchDropdown');
        const clearIcon = document.getElementById('clearIcon');

        // Icons
        const clockIcon = `<svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"></path></svg>`;
        
        const searchIconSvg = `<svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>`;

        // Event Listeners
        searchInput.addEventListener('focus', showDropdown);
        searchInput.addEventListener('blur', () => {
            setTimeout(hideDropdown, 200);
        });
        searchInput.addEventListener('input', handleInput);
        searchInput.addEventListener('keydown', handleKeyboard);
        clearIcon.addEventListener('click', clearSearch);

        function showDropdown() {
            searchBar.classList.add('focused');
            searchDropdown.classList.add('visible');
            renderSuggestions();
        }

        function hideDropdown() {
            searchBar.classList.remove('focused');
            searchDropdown.classList.remove('visible');
            selectedIndex = -1;
        }

        function handleInput(e) {
            const value = e.target.value.trim();
            
            // Show/hide clear icon
            if (value) {
                clearIcon.classList.add('visible');
            } else {
                clearIcon.classList.remove('visible');
            }

            renderSuggestions();
        }

        function clearSearch() {
            searchInput.value = '';
            clearIcon.classList.remove('visible');
            searchInput.focus();
            renderSuggestions();
        }

        function handleKeyboard(e) {
            const items = searchDropdown.querySelectorAll('.suggestion-item');
            
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                selectedIndex = Math.min(selectedIndex + 1, items.length - 1);
                updateSelection(items);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                selectedIndex = Math.max(selectedIndex - 1, -1);
                updateSelection(items);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (selectedIndex >= 0 && items[selectedIndex]) {
                    items[selectedIndex].click();
                }
            } else if (e.key === 'Escape') {
                hideDropdown();
            }
        }

        function updateSelection(items) {
            items.forEach((item, index) => {
                if (index === selectedIndex) {
                    item.classList.add('selected');
                    item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                } else {
                    item.classList.remove('selected');
                }
            });
        }

        function renderSuggestions() {
            const query = searchInput.value.trim().toLowerCase();
            let html = '';

            // Filter sections based on query
            let filteredSections = sections;
            if (query) {
                filteredSections = sections.filter(section => 
                    section.name.toLowerCase().includes(query)
                );
            }

            // Build suggestions array
            allSuggestions = [];

            // Recent searches (only if no query or matches query)
            const relevantRecent = query 
                ? recentSearches.filter(name => name.toLowerCase().includes(query))
                : recentSearches;

            // Add recent searches with clock icon
            relevantRecent.forEach(name => {
                const section = sections.find(s => s.name.toLowerCase() === name.toLowerCase());
                if (section) {
                    allSuggestions.push({ ...section, isRecent: true });
                }
            });

            // Add separator if we have recent searches AND other suggestions
            const needsSeparator = relevantRecent.length > 0 && filteredSections.length > 0;

            // Add filtered sections (avoid duplicates with recent)
            filteredSections.forEach(section => {
                const alreadyInRecent = relevantRecent.some(
                    name => name.toLowerCase() === section.name.toLowerCase()
                );
                if (!alreadyInRecent) {
                    allSuggestions.push({ ...section, isRecent: false });
                }
            });

            // Render suggestions - FIXED: Simplified separator logic
            let hasAddedSeparator = false;
            allSuggestions.forEach((suggestion, index) => {
                // Add separator between recent and regular suggestions
                if (needsSeparator && !hasAddedSeparator && suggestion.isRecent && 
                    index < allSuggestions.length - 1 && !allSuggestions[index + 1].isRecent) {
                    html += '<div class="dropdown-separator"></div>';
                    hasAddedSeparator = true;
                }

                const icon = suggestion.isRecent ? clockIcon : searchIconSvg;
                const recentClass = suggestion.isRecent ? 'recent' : '';
                
                html += `
                    <div class="suggestion-item ${recentClass}" data-section="${suggestion.id}" data-name="${suggestion.name}">
                        <div class="suggestion-icon">${icon}</div>
                        <div class="suggestion-text">${suggestion.name}</div>
                    </div>
                `;
            });

            // Show "No results" if nothing found
            if (allSuggestions.length === 0) {
                html = `
                    <div class="suggestion-item" style="color: #70757a; cursor: default;">
                        <div class="suggestion-text">No results found</div>
                    </div>
                `;
            }

            searchDropdown.innerHTML = html;

            // Add click handlers
            searchDropdown.querySelectorAll('.suggestion-item[data-section]').forEach((item, index) => {
                item.addEventListener('click', () => {
                    const sectionId = item.dataset.section;
                    const sectionName = item.dataset.name;
                    navigateToSection(sectionId, sectionName);
                });
            });

            selectedIndex = -1;
        }

        function navigateToSection(sectionId, sectionName) {
            // Add to recent searches
            addToRecentSearches(sectionName);
            
            // Navigate (in real implementation, this would scroll to section)
            console.log('Navigating to:', sectionName);
            alert(`Navigating to: ${sectionName}\n\nIn your portfolio, this will smooth scroll to #${sectionId}`);
            
            // Clear and close
            searchInput.value = '';
            clearIcon.classList.remove('visible');
            hideDropdown();
        }

        function addToRecentSearches(sectionName) {
            // Remove if already exists
            recentSearches = recentSearches.filter(name => name.toLowerCase() !== sectionName.toLowerCase());
            
            // Add to beginning
            recentSearches.unshift(sectionName);
            
            // Keep only last 5
            recentSearches = recentSearches.slice(0, 5);
            
            // Save to localStorage
            localStorage.setItem('portfolioSearchHistory', JSON.stringify(recentSearches));
        }
    </script>
</body>
</html>
